<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Guessing Game | Aishwarya B. Mini Project</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-family:'Outfit',Arial,sans-serif; background:linear-gradient(135deg,#060813,#1e1b4b,#0f172a);
  padding:20px; color:#fff;
}
.top-bar{width:100%;max-width:440px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
.back-btn{color:#06b6d4;text-decoration:none;font-weight:600;display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,0.06);padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);transition:.2s}
.back-btn:hover{background:rgba(6,182,212,0.2);color:#fff}
.card{
  width:100%; max-width:440px; background:rgba(18,22,48,0.75); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.12); border-radius:24px; padding:30px;
  box-shadow:0 15px 40px rgba(0,0,0,0.5); text-align:center;
}
h1{margin:0 0 8px;font-size:28px;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:#94a3b8;margin-bottom:18px;font-size:15px}
.range{font-size:38px;font-weight:800;margin:12px 0;color:#38bdf8;text-shadow:0 0 20px rgba(56,189,248,0.4)}
input{
  width:100%; padding:15px; font-size:18px; text-align:center;
  background:rgba(0,0,0,0.3); color:#fff;
  border:2px solid rgba(255,255,255,0.15); border-radius:14px; outline:none;
  font-family:inherit; transition:.2s;
}
input:focus{border-color:#38bdf8;box-shadow:0 0 15px rgba(56,189,248,0.3)}
button{
  width:100%; padding:14px; margin-top:12px; border:0; border-radius:14px;
  font-size:16px; font-weight:bold; cursor:pointer; font-family:inherit; transition:.2s;
}
.guess{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;box-shadow:0 4px 15px rgba(99,102,241,0.4)}
.guess:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(99,102,241,0.6)}
.new{background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.1)}
.new:hover{background:rgba(255,255,255,0.15)}
.message{min-height:28px;margin:20px 0 10px;font-weight:600;font-size:16px;color:#ffd166}
.stats{display:flex;justify-content:space-between;background:rgba(255,255,255,0.06);padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,0.08)}
.stats b{color:#38bdf8}
.small{font-size:13px;color:#64748b;margin-top:18px}
</style>
</head>
<body>
<div class="top-bar">
  <a href="../index.html#projects" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a>
  <span style="font-size:13px;color:#94a3b8">Aishwarya B. Mini Project</span>
</div>
<div class="card">
  <h1>🎯 Number Guessing Game</h1>
  <div class="sub">Guess the hidden number between 1 and 100!</div>
  <div class="range">1 – 100</div>

  <input id="guess" type="number" min="1" max="100" placeholder="Enter your guess (1-100)">
  <button class="guess" onclick="checkGuess()"><i class="fa-solid fa-crosshairs"></i> Submit Guess</button>
  <button class="new" onclick="newGame()"><i class="fa-solid fa-rotate-right"></i> New Game</button>

  <div class="message" id="message">Good luck! 🍀</div>

  <div class="stats">
    <span>Attempts: <b id="attempts">0</b></span>
    <span>Best Score: <b id="best">—</b></span>
  </div>

  <div class="small">Built with HTML5, CSS3 & JavaScript by Aishwarya B.</div>
</div>

<script>
let secret, attempts, best = null, finished = false;

function newGame(){
  secret = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  finished = false;
  document.getElementById("attempts").textContent = "0";
  document.getElementById("message").textContent = "Good luck! 🍀";
  document.getElementById("guess").value = "";
  document.getElementById("guess").disabled = false;
  document.querySelector(".guess").disabled = false;
  document.getElementById("guess").focus();
}

function checkGuess(){
  if(finished) return;

  const input = document.getElementById("guess");
  const n = Number(input.value);
  const msg = document.getElementById("message");

  if(!Number.isInteger(n) || n < 1 || n > 100){
    msg.textContent = "Please enter a valid number from 1 to 100.";
    return;
  }

  attempts++;
  document.getElementById("attempts").textContent = attempts;

  if(n === secret){
    finished = true;
    if(best === null || attempts < best) best = attempts;
    document.getElementById("best").textContent = best;
    msg.textContent = "🎉 Correct! You won in " + attempts + " attempt" + (attempts === 1 ? "" : "s") + "!";
    input.disabled = true;
    document.querySelector(".guess").disabled = true;
  } else if(n < secret){
    msg.textContent = "⬆️ Too low! Try a bigger number.";
  } else {
    msg.textContent = "⬇️ Too high! Try a smaller number.";
  }
  input.select();
}

document.getElementById("guess").addEventListener("keydown", function(e){
  if(e.key === "Enter") checkGuess();
});

newGame();
</script>
</body>
</html>
